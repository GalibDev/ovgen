<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6B58E8" />
    <meta
      name="description"
      content="Ovgen — your personal growth space. Build better habits, one day at a time."
    />
    <script>
      try {
        const preferences = JSON.parse(localStorage.getItem('ovgen-preferences') || '{}').state;
        const theme = preferences?.theme || 'system';
        const dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
    <title>Ovgen · Your growth space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
